<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>A.I Thiệt Chẩn — Đánh giá chuyên gia</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
body{margin:0;background:#f4f6f8;color:#111}main{max-width:820px;margin:auto;padding:16px 14px 48px}
section{background:#fff;border:1px solid #d9dde3;border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:1.35rem;margin:.2rem 0}h2{font-size:1.05rem}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:700;background:#111;color:#fff}
button.secondary{background:#e9edf2;color:#111}button.active{outline:3px solid #888}button:disabled{opacity:.55}
select,textarea,input{font:inherit;padding:8px;box-sizing:border-box;max-width:100%}textarea{width:100%;min-height:72px}
.status{padding:7px 10px;border-radius:10px;background:#eef1f4}.ok{background:#dff5e7}.warn{background:#fff0c9}.bad{background:#ffe0df}
.canvas-wrap{position:relative;width:min(100%,640px);aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#111;margin:auto;touch-action:none}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%}#maskCanvas{cursor:crosshair}
.hidden{display:none!important}.muted{color:#68727e;font-size:.9rem}.progress{font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{display:grid;gap:5px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
@media(prefers-color-scheme:dark){body{background:#0d1117;color:#e6edf3}section{background:#161b22;border-color:#30363d}button.secondary,.status{background:#30363d;color:#e6edf3}.muted{color:#9da7b3}.ok{background:#153b27}.warn{background:#4a3512}.bad{background:#4a1f1f}}
</style></head><body><main>
<h1>A.I THIỆT CHẨN — Đánh giá chuyên gia</h1>
<p class="muted">Một link dùng xuyên suốt. Không hiển thị kết quả A.I hay đánh giá của chuyên gia khác.</p>

<section id="loading"><div id="loadingText" class="status">Đang xác thực lời mời…</div></section>

<section id="attest" class="hidden">
<h2>Xác nhận một lần</h2>
<p><strong id="expertName"></strong> · <span id="expertTitle"></span></p>
<label><span><input id="attestCheck" type="checkbox" style="width:auto"> Tôi xác nhận thông tin chuyên môn của mình là đúng và chịu trách nhiệm về nhãn chuyên môn gửi trong phiên này.</span></label>
<button id="startBtn" type="button">Bắt đầu đánh giá</button>
</section>

<section id="task" class="hidden">
<div class="row"><span id="progress" class="status progress"></span><span id="saveStatus" class="status"></span></div>
<h2>Ảnh mặt trên · đánh giá độc lập</h2>
<div class="canvas-wrap"><canvas id="imageCanvas" width="160" height="160"></canvas><canvas id="maskCanvas" width="160" height="160"></canvas></div>
<div class="row" style="margin-top:10px">
<button id="paint" class="secondary active" type="button">Tô ROI</button>
<button id="erase" class="secondary" type="button">Xóa nét</button>
<button id="clear" class="secondary" type="button">Xóa ROI</button>
<label>Cỡ bút <input id="brush" type="range" min="2" max="18" value="7"></label>
</div>
<div class="row" style="margin-top:12px">
<label><span><input id="present" type="checkbox" checked style="width:auto"> Có lưỡi trong ảnh</span></label>
<label>Chất lượng<select id="quality"><option value="usable">Dùng được</option><option value="uncertain">Không chắc</option><option value="reject">Loại ảnh</option></select></label>
</div>
<div id="morphologyFields">
<div class="grid">
<label>Rãnh giữa<select id="medianSulcus"><option value="uncertain">Không chắc</option><option value="none">Không rõ/không thấy</option><option value="mild">Nhẹ</option><option value="prominent">Rõ</option><option value="not_visible">Không quan sát được</option></select></label>
<label>Nứt nhìn thấy<select id="fissureStatus"><option value="uncertain">Không chắc</option><option value="absent">Không thấy</option><option value="possible">Có thể</option><option value="present">Có</option></select></label>
<label>Phân nhánh nứt<select id="fissureBranching"><option value="uncertain">Không chắc</option><option value="not_applicable">Không áp dụng</option><option value="absent">Không</option><option value="present">Có</option></select></label>
<label>Kiểu nứt<select id="fissurePattern"><option value="uncertain">Không chắc</option><option value="not_applicable">Không áp dụng</option><option value="midline_only">Chỉ dọc giữa</option><option value="branched">Phân nhánh</option><option value="multiple">Nhiều rãnh</option><option value="network">Dạng mạng</option><option value="other">Khác</option></select></label>
<label>Dấu răng<select id="toothmarks"><option value="uncertain">Không chắc</option><option value="absent">Không thấy</option><option value="present">Có</option></select></label>
<label>Hình thể<select id="bodyShape"><option value="uncertain">Không chắc</option><option value="normal">Bình thường</option><option value="swollen">Bệu/to</option><option value="thin">Gầy/mỏng</option></select></label>
</div></div>
<label style="margin-top:10px">Ghi chú chuyên môn (không bắt buộc)<textarea id="notes" placeholder="Chỉ ghi nhận xét phục vụ nhãn; không nhập thông tin định danh người bệnh."></textarea></label>
<button id="submitBtn" type="button">Duyệt & ca tiếp theo</button>
<p class="muted">Nhãn được gửi về Admin duyệt trước khi được tính vào Gold.</p>
</section>

<section id="done" class="hidden"><h2 id="doneTitle">Hoàn tất</h2><p id="doneText"></p></section>
</main>
<script>
(function(){'use strict';
var SUPABASE_URL='https://gzmpnsrwqjpsbklyflqr.supabase.co';
var SUPABASE_KEY='sb_publishable_Y4hMhXROZ-aVgWoaQ5fFKQ_ZAcXuIzG';
var KEY='aitcExpertReviewTokenV1',W=160,H=160,$=id=>document.getElementById(id);
var token='',current=null,mode='paint',drawing=false,mask=new Uint8Array(W*H);
var imgCanvas=$('imageCanvas'),imgCtx=imgCanvas.getContext('2d'),maskCanvas=$('maskCanvas'),maskCtx=maskCanvas.getContext('2d');
async function rpc(name,payload){var r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify(payload)});var d=await r.json().catch(()=>null);if(!r.ok)throw new Error((d&&d.message)||(d&&d.hint)||(d&&d.error)||('HTTP '+r.status));return d}
function show(id,on){$(id).classList.toggle('hidden',!on)}
function fail(msg){$('loadingText').textContent=msg;$('loadingText').className='status bad';show('loading',true);show('attest',false);show('task',false);show('done',false)}
function status(msg,kind){$('saveStatus').textContent=msg;$('saveStatus').className='status '+(kind||'')}
function renderMask(){maskCtx.clearRect(0,0,W,H);var im=maskCtx.createImageData(W,H);for(var i=0;i<mask.length;i++)if(mask[i]){var j=i*4;im.data[j]=255;im.data[j+1]=32;im.data[j+2]=32;im.data[j+3]=105}maskCtx.putImageData(im,0,0)}
function drawAt(xc,yc){var r=maskCanvas.getBoundingClientRect(),x=(xc-r.left)*W/r.width,y=(yc-r.top)*H/r.height,rad=Number($('brush').value);for(var y0=Math.max(0,Math.floor(y-rad));y0<=Math.min(H-1,Math.ceil(y+rad));y0++)for(var x0=Math.max(0,Math.floor(x-rad));x0<=Math.min(W-1,Math.ceil(x+rad));x0++)if((x0-x)*(x0-x)+(y0-y)*(y0-y)<=rad*rad)mask[y0*W+x0]=mode==='paint'?1:0;renderMask()}
maskCanvas.addEventListener('pointerdown',e=>{drawing=true;maskCanvas.setPointerCapture(e.pointerId);drawAt(e.clientX,e.clientY)});
maskCanvas.addEventListener('pointermove',e=>{if(drawing)drawAt(e.clientX,e.clientY)});
maskCanvas.addEventListener('pointerup',()=>drawing=false);maskCanvas.addEventListener('pointercancel',()=>drawing=false);
$('paint').onclick=()=>{mode='paint';$('paint').classList.add('active');$('erase').classList.remove('active')};
$('erase').onclick=()=>{mode='erase';$('erase').classList.add('active');$('paint').classList.remove('active')};
$('clear').onclick=()=>{mask.fill(0);renderMask()};
function countMask(){var n=0;for(var i=0;i<mask.length;i++)n+=mask[i]?1:0;return n}
function encodeRle(){var counts=[],value=0,count=0;for(var i=0;i<mask.length;i++){var bit=mask[i]?1:0;if(bit===value){count++;continue}counts.push(count);count=1;value=bit}counts.push(count);return {size:[H,W],counts:counts,order:'row-major',startsWith:0}}
function loadImage(url){return new Promise((resolve,reject)=>{var im=new Image();im.onload=()=>{imgCtx.clearRect(0,0,W,H);imgCtx.drawImage(im,0,0,W,H);resolve()};im.onerror=reject;im.src=url})}
function resetForm(){mask=new Uint8Array(W*H);renderMask();$('present').checked=true;$('quality').value='usable';$('medianSulcus').value='uncertain';$('fissureStatus').value='uncertain';$('fissureBranching').value='uncertain';$('fissurePattern').value='uncertain';$('toothmarks').value='uncertain';$('bodyShape').value='uncertain';$('notes').value=''}
async function next(){
  try{
    var d=await rpc('ai_thiet_chan_expert_review_next_v1',{p_token:token});
    if(d.complete){show('task',false);show('done',true);$('doneTitle').textContent='Đã hoàn tất';$('doneText').textContent='Đã đủ '+d.target+' ca trong phiên chuyên gia này.';return}
    if(d.waitingForCases){show('task',false);show('done',true);$('doneTitle').textContent='Đang chờ thêm ca';$('doneText').textContent='Đã duyệt '+d.done+'/'+d.target+' ca. Hiện kho có '+d.availableCases+' ca xem được; hệ thống sẽ tiếp tục khi có thêm ca đủ điều kiện.';return}
    current=d;resetForm();show('loading',false);show('attest',false);show('done',false);show('task',true);
    var p=d.progress||{};$('progress').textContent=String(p.done||0)+'/'+String(p.target||50)+' ca';status('Sẵn sàng','ok');await loadImage(d.image.top);
  }catch(e){fail('Không mở được phiên: '+e.message)}
}
async function accept(){if(!$('attestCheck').checked){alert('Vui lòng xác nhận trách nhiệm chuyên môn.');return}$('startBtn').disabled=true;try{await rpc('ai_thiet_chan_expert_review_accept_v1',{p_token:token});await next()}catch(e){fail('Không xác nhận được phiên: '+e.message)}finally{$('startBtn').disabled=false}}
async function submit(){
  if(!(current&&current.blind_id))return;var present=$('present').checked;if(present&&countMask()===0){alert('Có lưỡi trong ảnh nhưng ROI đang rỗng.');return}
  var morphology=present?{schemaVersion:'tongue-morphology-label-v1',medianSulcus:{prominence:$('medianSulcus').value},fissure:{visualStatus:$('fissureStatus').value,branching:$('fissureBranching').value,pattern:$('fissurePattern').value,depth:'not_collected_from_2d'},toothmarks:{status:$('toothmarks').value},bodyShape:{status:$('bodyShape').value}}:null;
  var annotation={tongue_present:present,roi_mask_rle:present?encodeRle():null,image_quality:$('quality').value,morphology:morphology,notes:$('notes').value.trim()||null,coordinate_space:{width:W,height:H,order:'row-major'}};
  $('submitBtn').disabled=true;status('Đang lưu…','warn');
  try{await rpc('ai_thiet_chan_expert_review_submit_v1',{p_token:token,p_blind_id:current.blind_id,p_annotation:annotation});status('Đã lưu','ok');await next()}catch(e){status('Lỗi: '+e.message,'bad')}finally{$('submitBtn').disabled=false}
}
async function boot(){
  var qs=new URLSearchParams(location.search),t=qs.get('t');if(t){sessionStorage.setItem(KEY,t);history.replaceState(null,'',location.pathname)}
  token=sessionStorage.getItem(KEY)||'';if(!token){fail('Link chuyên gia không hợp lệ hoặc chưa có mã phiên.');return}
  try{var info=await rpc('ai_thiet_chan_expert_review_info_v1',{p_token:token});$('expertName').textContent=info.name||'';$('expertTitle').textContent=info.professionalTitle==='bac_si'?'Bác sĩ':'Y sĩ';show('loading',false);if(info.attested)await next();else show('attest',true)}catch(e){fail('Link đã hết hạn hoặc không hợp lệ.')}
}
$('startBtn').onclick=accept;$('submitBtn').onclick=submit;boot();
})();
</script></body></html>
