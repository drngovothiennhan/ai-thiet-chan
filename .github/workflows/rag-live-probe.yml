name: AITC RAG Live Probe

on:
  push:
    branches:
      - restructure-local-vision-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-rag-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ENV: preview
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AITC_CASE_RETRIEVAL_REMOTE_TIMEOUT_MS: "12000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Probe live Render SQLite retrieval
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const healthResponse=await fetch('https://aitc-case-retrieval-preview.onrender.com/health');
          assert.equal(healthResponse.status,200);
          const health=await healthResponse.json();
          assert.equal(health.ready,true);
          assert.equal(health.records,44643);
          assert.equal(health.sourceCounts['tcmchat-medical-case-sft-v1'],44623);
          assert.equal(health.sourceCounts['pmc-ccby-cc0-case-reports-v1'],20);

          const searchResponse=await fetch('https://aitc-case-retrieval-preview.onrender.com/search',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify({terms:['头痛','头晕','舌红','苔黄'],limit:4})
          });
          assert.equal(searchResponse.status,200);
          const search=await searchResponse.json();
          assert.equal(search.ok,true);
          assert.ok(search.returned>0);
          assert.ok(search.returned<=4);
          console.log('LIVE_RETRIEVAL_HEALTH',JSON.stringify({
            records:health.records,
            sourceCounts:health.sourceCounts,
            defaultTopK:health.defaultTopK,
            maxTopK:health.maxTopK
          }));
          console.log('LIVE_RETRIEVAL_SEARCH',JSON.stringify({
            terms:search.terms,
            returned:search.returned,
            cases:search.cases.map(x=>({
              id:x.id,
              sourceId:x.sourceId,
              sourceRecordId:x.sourceRecordId,
              task:x.task,
              rank:x.rank,
              casePreview:String(x.caseText||'').slice(0,220)
            }))
          }));
          NODE

      - name: Start current branch server
        if: env.GEMINI_API_KEY != ''
        run: |
          PORT=3100 node --import ./runtime-guard.mjs server.mjs > /tmp/aitc-rag-server.log 2>&1 &
          echo $! > /tmp/aitc-rag-server.pid
          node --input-type=module <<'NODE'
          for(let i=0;i<45;i++){
            try{
              const r=await fetch('http://127.0.0.1:3100/api/health');
              if(r.ok){process.exit(0);}
            }catch{}
            await new Promise(r=>setTimeout(r,1000));
          }
          process.exit(1);
          NODE

      - name: Probe real current-branch api chat with live retrieval
        if: env.GEMINI_API_KEY != ''
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const healthResponse=await fetch('http://127.0.0.1:3100/api/health');
          assert.equal(healthResponse.status,200);
          const health=await healthResponse.json();
          assert.equal(health.caseReasoningRetrieval.ready,true);
          assert.equal(health.caseReasoningRetrieval.records,44643);
          assert.equal(health.caseReasoningRetrieval.mode,'remote');

          const payload={
            assessment:{
              mode:'normal',
              top:{
                quality:'good',
                confidence:0.72,
                visualValidity:{tongueVisible:true,wholeTongueVisible:true,rootVisible:true,framing:'adequate',occlusion:'none',colorReliability:'good'},
                tongueColor:'Đỏ',
                shape:'Bình thường',
                coatingColor:'Vàng',
                coatingThickness:'Mỏng',
                coatingTexture:'Bình thường',
                moisture:'Nhuận',
                morphology:{
                  medianSulcus:{status:'possible',prominence:'mild',orientation:'midline',source:'local-vision'},
                  fissure:{status:'unknown',branching:'unknown',pattern:'unknown',location:'unknown',width:'unknown',depth:'not-assessable-from-2d-image',source:'local-vision'}
                },
                toothmarks:'Không xác định',
                pricklesSpots:'Không xác định',
                stasisMarks:'Không xác định',
                otherVisibleFeatures:[],
                theoryAssessment:{generalSignals:[],stomachPatternSignals:[],cannotConclude:['Chưa đủ tứ chẩn để kết luận thể.']},
                limitations:[]
              },
              bottom:null,
              combined:{
                confidence:0.72,
                summary:'Quan sát cấu trúc: chất lưỡi đỏ, rêu vàng mỏng.',
                generalSignals:[],
                stomachPatternSignals:[],
                cannotConclude:['Chưa đủ tứ chẩn để chẩn đoán xác định.']
              },
              approvedClinicalKnowledge:[],
              knowledgeVersion:'probe'
            },
            message:'Tôi có đau đầu và chóng mặt. Hãy đối chiếu với vài ca tương tự để học tập, không chẩn đoán xác định và không kê đơn.'
          };

          const response=await fetch('http://127.0.0.1:3100/api/chat',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify(payload)
          });
          const data=await response.json();
          assert.equal(response.status,200,JSON.stringify(data));
          assert.equal(data.ok,true);
          assert.equal(data.caseRetrieval.mode,'remote');
          assert.ok(data.caseRetrieval.returned>0);
          assert.ok(data.caseRetrieval.returned<=4);
          console.log('LIVE_API_CHAT',JSON.stringify({
            status:response.status,
            model:data.model,
            grounding:data.grounding,
            caseRetrieval:data.caseRetrieval,
            replyPreview:String(data.reply||'').slice(0,600)
          }));
          NODE

      - name: Report missing Gemini secret without fabricating chat pass
        if: env.GEMINI_API_KEY == ''
        run: echo "CHAT_SKIPPED_NO_GEMINI_SECRET"

      - name: Print server log on failure
        if: failure() && env.GEMINI_API_KEY != ''
        run: cat /tmp/aitc-rag-server.log || true

      - name: Stop server
        if: always() && env.GEMINI_API_KEY != ''
        run: |
          test -f /tmp/aitc-rag-server.pid && kill "$(cat /tmp/aitc-rag-server.pid)" || true
