name: A.I Thiet Chan CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'knowledge.mjs'
      - 'knowledge-evidence.mjs'
      - 'knowledge-extended.mjs'
      - 'runtime-guard.mjs'
      - 'server.mjs'
      - 'public/**'
      - 'tests/**'
      - 'vercel.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npm run check

  live-rag-current-head:
    if: github.event_name == 'pull_request' && github.head_ref == 'restructure-local-vision-v1'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ENV: preview
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AITC_CASE_RETRIEVAL_REMOTE_TIMEOUT_MS: "12000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --omit=dev

      - name: Probe real Render SQLite retrieval through current branch module
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const mod=await import('./case-retrieval.mjs?live-ci=1');
          const health=await mod.caseRetrievalRuntimeHealth();
          assert.equal(health.ready,true,JSON.stringify(health));
          assert.equal(health.mode,'remote');
          assert.equal(health.records,44643);
          assert.equal(health.sourceCounts['tcmchat-medical-case-sft-v1'],44623);
          assert.equal(health.sourceCounts['pmc-ccby-cc0-case-reports-v1'],20);
          const result=await mod.retrieveSimilarCasesRuntime(
            'Người dùng mô tả đau đầu, chóng mặt; quan sát cấu trúc: lưỡi đỏ, rêu vàng mỏng.',
            {limit:4}
          );
          assert.equal(result.mode,'remote');
          assert.ok(result.returned>0,JSON.stringify(result));
          assert.ok(result.returned<=4);
          console.log('CURRENT_HEAD_LIVE_RETRIEVAL',JSON.stringify({
            health:{ready:health.ready,mode:health.mode,records:health.records,sourceCounts:health.sourceCounts},
            query:{terms:result.terms,returned:result.returned},
            cases:result.cases.map(x=>({id:x.id,sourceId:x.sourceId,sourceRecordId:x.sourceRecordId,rank:x.rank}))
          }));
          NODE

      - name: Simulate retrieved real cases into real production consultation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const mod=await import('./case-retrieval.mjs?prod-sim=1');
          const result=await mod.retrieveSimilarCasesRuntime(
            'Người dùng mô tả đau đầu, chóng mặt; quan sát cấu trúc: lưỡi đỏ, rêu vàng mỏng.',
            {limit:4}
          );
          assert.ok(result.returned>0,JSON.stringify(result));
          const selected=result.cases.map((x,i)=>({
            index:i+1,
            sourceId:x.sourceId,
            sourceRecordId:x.sourceRecordId,
            rank:x.rank,
            caseText:String(x.caseText||'').slice(0,650)
          }));
          const ragContext=selected.map(x=>[
            `CA ${x.index} | source=${x.sourceId} | record=${x.sourceRecordId} | bm25=${x.rank}`,
            x.caseText
          ].join('\n')).join('\n\n');
          const payload={
            assessment:{
              mode:'normal',
              top:{
                quality:'good',
                confidence:0.72,
                visualValidity:{tongueVisible:true,wholeTongueVisible:true,rootVisible:true,framing:'adequate',occlusion:'none',colorReliability:'good'},
                tongueColor:'Đỏ',
                shape:'Bình thường',
                coatingColor:'Vàng',
                coatingThickness:'Mỏng',
                coatingTexture:'Bình thường',
                moisture:'Nhuận',
                morphology:{
                  medianSulcus:{status:'possible',prominence:'mild',orientation:'midline',source:'local-vision'},
                  fissure:{status:'unknown',branching:'unknown',pattern:'unknown',location:'unknown',width:'unknown',depth:'not-assessable-from-2d-image',source:'local-vision'}
                },
                toothmarks:'Không xác định',
                pricklesSpots:'Không xác định',
                stasisMarks:'Không xác định',
                otherVisibleFeatures:[],
                theoryAssessment:{generalSignals:[],stomachPatternSignals:[],cannotConclude:['Chưa đủ tứ chẩn để kết luận thể.']},
                limitations:[]
              },
              bottom:null,
              combined:{
                confidence:0.72,
                summary:'Quan sát cấu trúc: chất lưỡi đỏ, rêu vàng mỏng.',
                generalSignals:[],
                stomachPatternSignals:[],
                cannotConclude:['Chưa đủ tứ chẩn để chẩn đoán xác định.']
              },
              approvedClinicalKnowledge:[],
              knowledgeVersion:'live-rag-ci'
            },
            message:`[MÔ PHỎNG RAG - DỮ LIỆU TRUY HỒI THẬT, KHÔNG PHẢI GOLD]
Các ca dưới đây chỉ để đối chiếu tương đồng, không được biến đáp án lịch sử thành chẩn đoán hiện tại và không kê đơn từ ca cũ.

${ragContext}

Dữ kiện hiện tại: người dùng cho biết đau đầu và chóng mặt; quan sát cấu trúc ghi chất lưỡi đỏ, rêu vàng mỏng.
Hãy đối chiếu điểm giống/khác với các ca trên theo hướng học tập, nêu rõ giới hạn và không chẩn đoán xác định.`
          };
          const response=await fetch('https://ai-thiet-chan.vercel.app/api/chat',{
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify(payload)
          });
          const data=await response.json().catch(()=>({}));
          assert.equal(response.status,200,JSON.stringify(data));
          assert.equal(data.ok,true);
          console.log('REAL_PRODUCTION_CONSULTATION_WITH_LIVE_RETRIEVAL_CONTEXT',JSON.stringify({
            retrievalReturned:result.returned,
            retrievalCases:selected.map(x=>({sourceId:x.sourceId,sourceRecordId:x.sourceRecordId,rank:x.rank})),
            consultationStatus:response.status,
            model:data.model,
            grounding:data.grounding,
            replyPreview:String(data.reply||'').slice(0,800)
          }));
          NODE

      - name: Start current branch server with GitHub Gemini secret
        if: env.GEMINI_API_KEY != ''
        run: |
          PORT=3100 node --import ./runtime-guard.mjs server.mjs > /tmp/aitc-rag-server.log 2>&1 &
          echo $! > /tmp/aitc-rag-server.pid
          node --input-type=module <<'NODE'
          for(let i=0;i<45;i++){
            try{
              const r=await fetch('http://127.0.0.1:3100/api/health');
              if(r.ok) process.exit(0);
            }catch{}
            await new Promise(r=>setTimeout(r,1000));
          }
          process.exit(1);
          NODE

      - name: Probe current branch api health and chat
        if: env.GEMINI_API_KEY != ''
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const healthResponse=await fetch('http://127.0.0.1:3100/api/health');
          const health=await healthResponse.json();
          assert.equal(healthResponse.status,200);
          assert.equal(health.caseReasoningRetrieval.ready,true,JSON.stringify(health.caseReasoningRetrieval));
          assert.equal(health.caseReasoningRetrieval.mode,'remote');
          assert.equal(health.caseReasoningRetrieval.records,44643);
          const payload={
            assessment:{
              mode:'normal',
              top:{
                quality:'good',
                confidence:0.72,
                visualValidity:{tongueVisible:true,wholeTongueVisible:true,rootVisible:true,framing:'adequate',occlusion:'none',colorReliability:'good'},
                tongueColor:'Đỏ',shape:'Bình thường',coatingColor:'Vàng',coatingThickness:'Mỏng',
                coatingTexture:'Bình thường',moisture:'Nhuận',
                morphology:{
                  medianSulcus:{status:'possible',prominence:'mild',orientation:'midline',source:'local-vision'},
                  fissure:{status:'unknown',branching:'unknown',pattern:'unknown',location:'unknown',width:'unknown',depth:'not-assessable-from-2d-image',source:'local-vision'}
                },
                toothmarks:'Không xác định',pricklesSpots:'Không xác định',stasisMarks:'Không xác định',
                otherVisibleFeatures:[],
                theoryAssessment:{generalSignals:[],stomachPatternSignals:[],cannotConclude:['Chưa đủ tứ chẩn để kết luận thể.']},
                limitations:[]
              },
              bottom:null,
              combined:{
                confidence:0.72,
                summary:'Quan sát cấu trúc: chất lưỡi đỏ, rêu vàng mỏng.',
                generalSignals:[],stomachPatternSignals:[],
                cannotConclude:['Chưa đủ tứ chẩn để chẩn đoán xác định.']
              },
              approvedClinicalKnowledge:[],
              knowledgeVersion:'live-rag-ci'
            },
            message:'Tôi có đau đầu và chóng mặt. Hãy đối chiếu với vài ca tương tự để học tập, không chẩn đoán xác định và không kê đơn.'
          };
          const response=await fetch('http://127.0.0.1:3100/api/chat',{
            method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)
          });
          const data=await response.json().catch(()=>({}));
          assert.equal(response.status,200,JSON.stringify(data));
          assert.equal(data.ok,true);
          assert.equal(data.caseRetrieval.mode,'remote');
          assert.ok(data.caseRetrieval.returned>0,JSON.stringify(data.caseRetrieval));
          assert.ok(data.caseRetrieval.returned<=4);
          console.log('CURRENT_HEAD_API_CHAT',JSON.stringify({
            status:response.status,
            model:data.model,
            grounding:data.grounding,
            caseRetrieval:data.caseRetrieval,
            replyPreview:String(data.reply||'').slice(0,600)
          }));
          NODE

      - name: Mark unavailable GitHub Gemini secret without claiming current-head api chat pass
        if: env.GEMINI_API_KEY == ''
        run: echo "CURRENT_HEAD_API_CHAT_SKIPPED_NO_GITHUB_GEMINI_SECRET"

      - name: Print current branch server log on failure
        if: failure() && env.GEMINI_API_KEY != ''
        run: cat /tmp/aitc-rag-server.log || true

      - name: Stop current branch server
        if: always() && env.GEMINI_API_KEY != ''
        run: |
          test -f /tmp/aitc-rag-server.pid && kill "$(cat /tmp/aitc-rag-server.pid)" || true
