name: Apply fallback persistence hotfix v4

on:
  push:
    paths:
      - '.github/workflows/apply-fallback-persistence-hotfix-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply persistence hotfix
        run: node scripts/apply-fallback-persistence-hotfix.mjs
      - name: Install dependencies
        run: npm install
      - name: Verify changed runtime and storage contracts
        run: |
          node --check server.mjs
          node --check public/analysis-hotfix.js
          node tests/analysis-hotfix-smoke.mjs
          node tests/access-control-smoke.mjs
          node tests/ml-storage-contract-smoke.mjs
          node tests/quality-grounding-v4-smoke.mjs
      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs public/analysis-hotfix.js tests/analysis-hotfix-smoke.mjs
          if git diff --cached --quiet; then
            echo "No hotfix changes required"
          else
            git commit -m "fix: persist local fallback analysis before success state"
            git push origin HEAD:main
          fi
