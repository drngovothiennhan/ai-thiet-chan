name: AITC Source Backup Carrier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aitc-source-backup-carrier.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8c5b06a866c26f2fb78e08a3c6eee2e38f2742ec
          fetch-depth: 1
      - name: Build source and AI knowledge snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          zip -q -r AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.zip . \
            -x 'AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.zip'
          sha256sum AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.zip | tee AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.sha256
          stat -c '%s' AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.zip | tee AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.bytes
      - name: Upload source backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8
          path: |
            AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.zip
            AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.sha256
            AITC_SOURCE_AI_KNOWLEDGE_8c5b06a8.bytes
          compression-level: 0
          retention-days: 1
