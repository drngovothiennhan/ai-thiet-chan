name: A.I Thiet Chan CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'knowledge.mjs'
      - 'knowledge-evidence.mjs'
      - 'knowledge-extended.mjs'
      - 'runtime-guard.mjs'
      - 'server.mjs'
      - 'public/**'
      - 'tests/**'
      - 'vercel.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npm run check
      - name: Live RAG current-head probe
        env:
          VERCEL_ENV: preview
          AITC_CASE_RETRIEVAL_REMOTE_TIMEOUT_MS: "15000"
        run: node tests/llm-case-retrieval-live-probe.mjs
