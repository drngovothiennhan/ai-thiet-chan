name: A.I Thiet Chan CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'knowledge.mjs'
      - 'runtime-guard.mjs'
      - 'server.mjs'
      - 'public/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npm run check
