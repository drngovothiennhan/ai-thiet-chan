name: Cloudflare Temporary Preview Probe

on:
  push:
    branches:
      - cloudflare-rebuild-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: https://ai-thiet-chan-cf-preview.comfortable-fastball.workers.dev
    steps:
      - name: Probe static app
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o home.html -w "%{http_code}" "$PREVIEW_URL/")
          echo "HOME_HTTP=$code"
          test "$code" = "200"
          grep -q "A.I" home.html
      - name: Probe API health
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o health.json -w "%{http_code}" "$PREVIEW_URL/api/health")
          echo "HEALTH_HTTP=$code"
          cat health.json
          test "$code" = "200"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('health.json','utf8'));if(!d.ok)process.exit(2);console.log(JSON.stringify({ok:d.ok,version:d.version,caseReasoningRetrieval:d.caseReasoningRetrieval,vision:d.vision,consultation:d.consultation},null,2));"
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-temporary-preview-probe
          path: |
            home.html
            health.json
          if-no-files-found: ignore
