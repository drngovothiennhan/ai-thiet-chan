name: Stage3B Fetch Wrapper Inventory
on:
  push:
    branches:
      - hardening/request-pipeline-cleanup-v3b
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory fetch wrapper patterns
        shell: bash
        run: |
          set -euo pipefail
          echo '=== window.fetch assignments ==='
          grep -RInE 'window\.fetch[[:space:]]*=' public tests . --exclude-dir=.git || true
          echo '=== const nativeFetch ==='
          grep -RInF 'const nativeFetch' public tests . --exclude-dir=.git || true
          echo '=== priorFetch ==='
          grep -RInF 'priorFetch' public tests . --exclude-dir=.git || true
          echo '=== __aitcRawFetch ==='
          grep -RInF '__aitcRawFetch' public tests . --exclude-dir=.git || true
          echo '=== previousFetch ==='
          grep -RInF 'previousFetch' public tests . --exclude-dir=.git || true
