<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b64" />
  <title>Cập nhật A.I Thiệt Chẩn</title>
  <style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef6f4;color:#17302d;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,88vw);background:#fff;border:1px solid #dbe9e6;border-radius:20px;padding:24px;box-shadow:0 18px 50px #17302d18}.spin{width:32px;height:32px;border:4px solid #cde1dd;border-top-color:#0b6b64;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{line-height:1.55;color:#536d68}</style>
</head>
<body>
  <main class="card">
    <div class="spin" aria-hidden="true"></div>
    <h1>Đang cập nhật A.I Thiệt Chẩn</h1>
    <p id="status">Đang loại bỏ cache/PWA cũ và tải bản production mới nhất…</p>
  </main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg=>reg.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
        status.textContent='Đã xóa bản cũ. Đang mở production mới…';
      }catch{
        status.textContent='Đang mở production mới…';
      }
      setTimeout(()=>location.replace('/?release=20260915-fastfix'),250);
    })();
  </script>
</body>
</html>
