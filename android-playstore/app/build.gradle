plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hiu.yhct.aithietchan'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hiu.yhct.aithietchan'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    def storeFilePath = System.getenv('ANDROID_KEYSTORE_PATH')
    def storePasswordEnv = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def keyAliasEnv = System.getenv('ANDROID_KEY_ALIAS')
    def keyPasswordEnv = System.getenv('ANDROID_KEY_PASSWORD')

    if (storeFilePath && storePasswordEnv && keyAliasEnv && keyPasswordEnv) {
        signingConfigs {
            release {
                storeFile file(storeFilePath)
                storePassword storePasswordEnv
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
