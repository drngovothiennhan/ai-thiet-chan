<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b64" />
  <title>Khôi phục A.I Thiệt Chẩn</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17302d;background:#eef6f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#dff3ef,#f7faf9)}
    main{width:min(520px,100%);background:#fff;border:1px solid #dbe9e6;border-radius:22px;padding:24px;box-shadow:0 12px 34px rgba(18,72,67,.08);text-align:center}
    h1{margin:0 0 10px;font-size:22px;color:#163e3a}p{margin:0;color:#647773;line-height:1.5}.spinner{width:42px;height:42px;margin:20px auto;border:4px solid #d7ebe7;border-top-color:#0b6b64;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    button{margin-top:18px;border:0;border-radius:14px;min-height:46px;padding:10px 16px;background:#0b6b64;color:#fff;font-weight:750;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>Đang làm mới A.I Thiệt Chẩn</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status">Đang gỡ service worker/cache cũ và tải lại bản production mới nhất…</p>
    <button id="retry" type="button" hidden>Tải lại ứng dụng</button>
  </main>
  <script>
    (()=>{
      const status=document.getElementById('status');
      const retry=document.getElementById('retry');
      const go=async()=>{
        retry.hidden=true;
        status.textContent='Đang gỡ service worker/cache cũ và tải lại bản production mới nhất…';
        try{
          if('serviceWorker' in navigator){
            const regs=await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.filter(r=>r.scope.startsWith(location.origin+'/')).map(r=>r.unregister()));
          }
        }catch{}
        try{
          if('caches' in window){
            const keys=await caches.keys();
            await Promise.all(keys.filter(k=>k.startsWith('ai-thiet-chan-')).map(k=>caches.delete(k)));
          }
        }catch{}
        try{sessionStorage.setItem('aitc-recovery-complete-v1',String(Date.now()));}catch{}
        setTimeout(()=>location.replace('/?recovered='+Date.now()),150);
      };
      retry.addEventListener('click',go);
      go().catch(()=>{status.textContent='Không thể tự làm mới. Nhấn nút bên dưới để thử lại.';retry.hidden=false;});
    })();
  </script>
</body>
</html>
