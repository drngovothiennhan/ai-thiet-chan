name: Apply A.I Thiet Chan 2.9.0

on:
  push:
    paths:
      - '.github/workflows/apply-release-2.9.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply locked release patch
        run: node scripts/apply-release-2.9.0.mjs
      - name: Install dependencies
        run: npm install
      - name: Verify full system gate
        run: npm run check
      - name: Commit verified release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs package.json public tests
          if git diff --cached --quiet; then
            echo "No release changes required"
          else
            git commit -m "release: A.I Thiệt Chẩn 2.9.0 grounded workflow"
            git push origin HEAD:main
          fi
