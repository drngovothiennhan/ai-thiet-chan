[package]
name = "aitc-local-runtime"
version = "0.1.0"
description = "A.I Thiet Chan local-first runtime shell"
authors = ["A.I Thiet Chan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aitc_local_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
libloading = "0.8"
