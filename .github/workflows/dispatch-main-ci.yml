name: Dispatch Main CI

on:
  push:
    branches:
      - ops/knowledge-5doc-resume-20260915
    paths:
      - '.github/workflows/dispatch-main-ci.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI for main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
