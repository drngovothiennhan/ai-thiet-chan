name: Apply student access v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-student-access-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply student access patch
        run: node scripts/apply-student-access-v1.mjs

      - name: Verify syntax
        run: |
          node --check access-control.mjs
          node --check server.mjs
          node --check public/access-control.js
          node --check public/user-admin.js
          node --check public/settings.js
          node tests/access-control-smoke.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs public/settings.js package.json
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat: enforce student access and guest daily quota"
          git push origin HEAD:main
