name: A.I Thiet Chan CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'knowledge.mjs'
      - 'knowledge-evidence.mjs'
      - 'knowledge-extended.mjs'
      - 'runtime-guard.mjs'
      - 'server.mjs'
      - 'public/**'
      - 'tests/**'
      - 'vercel.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npm run check
      - name: Build source bundle for Vercel connector
        run: tar --exclude='.git' --exclude='node_modules' -czf /tmp/ai-thiet-chan-source.tgz .
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-thiet-chan-source
          path: /tmp/ai-thiet-chan-source.tgz
          if-no-files-found: error
          compression-level: 0
