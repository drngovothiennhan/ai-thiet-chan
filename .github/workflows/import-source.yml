name: Import A.I Thiet Chan source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout canonical source branch
        uses: actions/checkout@v4
        with:
          repository: drngovothiennhan/Dr.Ngovothiennhan
          ref: ai-thiet-chan-web-rebuild
          path: _source

      - name: Copy A.I Thiet Chan app to repository root
        shell: bash
        run: |
          shopt -s dotglob
          cp -a _source/ai-thiet-chan-web/* ./
          rm -rf _source

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "chore: import A.I Thiet Chan web source"
          git push origin HEAD:main
