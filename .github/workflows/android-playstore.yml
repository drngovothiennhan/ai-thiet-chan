name: Android Play Store Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - playstore-release-v1
    paths:
      - 'android-playstore/**'
      - '.github/workflows/android-playstore.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android 16 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Decode signing key when configured
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ai-thiet-chan-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ai-thiet-chan-upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle and debug APK
        run: gradle -p android-playstore --no-daemon clean bundleRelease assembleDebug

      - name: Verify signed bundle when signing is configured
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: jarsigner -verify -verbose -certs android-playstore/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-thiet-chan-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            android-playstore/app/build/outputs/bundle/release/app-release.aab
            android-playstore/app/build/outputs/apk/debug/app-debug.apk
